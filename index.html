<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opti_Route</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {}
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#020617] text-slate-800 dark:text-slate-300 font-sans transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Lucide Icon Helper Component
    const Icon = ({ name, size = 20, className = '' }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i ref={iconRef} data-lucide={name} style={{ width: size, height: size, display: 'inline-block' }} className={className}></i>;
    };

    // Audio Helpers
    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    function pcmToWav(pcm16, sampleRate) {
      const numChannels = 1;
      const byteRate = sampleRate * numChannels * 2;
      const blockAlign = numChannels * 2;
      const dataSize = pcm16.length * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < pcm16.length; i++, offset += 2) {
        view.setInt16(offset, pcm16[i], true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    const BENGALURU_ZONES = [
      { id: 'yel', name: 'Yelahanka', x: 50, y: 15, demand: 2200 },
      { id: 'heb', name: 'Hebbal', x: 50, y: 30, demand: 3100 },
      { id: 'mal', name: 'Malleswaram', x: 35, y: 40, demand: 2800 },
      { id: 'ind', name: 'Indiranagar', x: 65, y: 45, demand: 4500 },
      { id: 'mar', name: 'Marathahalli', x: 80, y: 45, demand: 3900 },
      { id: 'wht', name: 'Whitefield', x: 90, y: 40, demand: 5200 },
      { id: 'kor', name: 'Koramangala', x: 60, y: 60, demand: 4800 },
      { id: 'jay', name: 'Jayanagar', x: 45, y: 65, demand: 3600 },
      { id: 'ban', name: 'Banashankari', x: 35, y: 70, demand: 2500 },
      { id: 'bel', name: 'Bellandur', x: 75, y: 65, demand: 4200 },
      { id: 'hsr', name: 'HSR Layout', x: 65, y: 70, demand: 3800 },
      { id: 'elb', name: 'Electronic City', x: 70, y: 90, demand: 4100 },
    ];

    const OptiRouteLogo = ({ className = "" }) => (
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" className={`w-9 h-9 ${className}`}>
        <circle cx="14" cy="20" r="10" stroke="currentColor" strokeWidth="4" className="text-slate-800 dark:text-white" />
        <path d="M26 10v20M26 20h4a6 6 0 1 0 0-12h-4M30 20l5 10" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" className="text-slate-800 dark:text-white" />
        <circle cx="35" cy="30" r="4" fill="#06b6d4" />
        <circle cx="20" cy="10" r="3" fill="#8b5cf6" />
      </svg>
    );

    const Card = ({ children, className = '' }) => (
      <div className={`bg-white/90 dark:bg-slate-900/60 backdrop-blur-md rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden shadow-xl dark:shadow-2xl transition-colors duration-300 ${className}`}>
        {children}
      </div>
    );

    const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false }) => {
      const base = "inline-flex items-center justify-center px-4 py-2 rounded-lg font-medium transition-all duration-300 ease-out";
      const variants = {
        primary: "bg-cyan-600 hover:bg-cyan-700 text-white dark:bg-cyan-500 dark:hover:bg-cyan-400 dark:text-slate-950 shadow-[0_0_15px_rgba(8,145,178,0.3)] hover:shadow-[0_0_25px_rgba(8,145,178,0.5)] dark:shadow-[0_0_15px_rgba(6,182,212,0.3)] dark:hover:shadow-[0_0_25px_rgba(6,182,212,0.5)] disabled:bg-slate-300 dark:disabled:bg-cyan-900 disabled:shadow-none",
        secondary: "bg-slate-100 dark:bg-slate-800/80 text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700",
        danger: "bg-rose-100 dark:bg-rose-500/10 hover:bg-rose-200 dark:hover:bg-rose-500/20 text-rose-700 dark:text-rose-400 border border-rose-300 dark:border-rose-500/30",
        outline: "border border-cyan-500/50 text-cyan-600 dark:text-cyan-400 hover:bg-cyan-50 dark:hover:bg-cyan-500/10"
      };
      return (
        <button onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${className} ${disabled ? 'cursor-not-allowed opacity-50' : ''}`}>
          {children}
        </button>
      );
    };

    const KpiCard = ({ title, value, subtext, iconName, trend = 'neutral' }) => (
      <Card className="p-5 flex flex-col justify-between h-full">
        <div className="flex justify-between items-start mb-2">
          <span className="text-sm font-medium text-slate-500 dark:text-slate-400">{title}</span>
          <div className={`p-2 rounded-lg ${
            trend === 'positive' ? 'bg-emerald-100 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400' : 
            trend === 'negative' ? 'bg-rose-100 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400' : 
            'bg-cyan-100 text-cyan-600 dark:bg-cyan-500/10 dark:text-cyan-400'
          }`}>
            <Icon name={iconName} size={18} />
          </div>
        </div>
        <div>
          <h3 className="text-2xl font-bold text-slate-900 dark:text-white">{value}</h3>
          {subtext && (
            <p className={`text-xs mt-1 font-medium ${trend === 'positive' ? 'text-emerald-600 dark:text-emerald-400/80' : trend === 'negative' ? 'text-rose-600 dark:text-rose-400/80' : 'text-slate-500'}`}>
              {subtext}
            </p>
          )}
        </div>
      </Card>
    );

    const InteractiveMap = ({ mode = 'demand', activeHubs = [], disruptedHubs = [], onNodeClick = () => {}, isDark }) => {
      const [hoveredNode, setHoveredNode] = useState(null);

      const assignments = useMemo(() => {
        if (mode === 'demand' || mode === 'config') return [];
        const availableHubs = activeHubs.filter(h => !disruptedHubs.includes(h));
        if (availableHubs.length === 0) return [];
        return BENGALURU_ZONES.map(zone => {
          if (availableHubs.includes(zone.id)) return null;
          let minDistance = Infinity;
          let closestHubId = null;
          availableHubs.forEach(hubId => {
            const hub = BENGALURU_ZONES.find(z => z.id === hubId);
            const dist = Math.sqrt(Math.pow(zone.x - hub.x, 2) + Math.pow(zone.y - hub.y, 2));
            if (dist < minDistance) { minDistance = dist; closestHubId = hub.id; }
          });
          return { from: closestHubId, to: zone.id, distance: minDistance };
        }).filter(Boolean);
      }, [mode, activeHubs, disruptedHubs]);

      return (
        <div className={`relative w-full aspect-video rounded-lg border overflow-hidden group ${isDark ? 'bg-[#020617] border-slate-800/80' : 'bg-slate-50 border-slate-300'}`}>
          <div 
            className="absolute inset-0" 
            style={{ 
              backgroundImage: isDark ? 'radial-gradient(#1e293b 1px, transparent 1px)' : 'radial-gradient(#cbd5e1 1px, transparent 1px)', 
              backgroundSize: '30px 30px', 
              opacity: 0.6 
            }}
          ></div>
          
          {hoveredNode && (
            <div className={`absolute z-10 border px-3 py-2 rounded-lg text-sm shadow-xl pointer-events-none transform -translate-x-1/2 -translate-y-[120%] transition-opacity duration-200 ${isDark ? 'bg-slate-900 border-slate-700 text-slate-200' : 'bg-white border-slate-200 text-slate-800'}`} style={{ left: `${hoveredNode.x}%`, top: `${hoveredNode.y}%` }}>
              <div className={`font-bold flex items-center gap-2 ${isDark ? 'text-white' : 'text-slate-900'}`}>
                {hoveredNode.name}
                {activeHubs.includes(hoveredNode.id) && (
                   <span className={`text-[10px] px-1.5 py-0.5 rounded uppercase tracking-wider ${
                     disruptedHubs.includes(hoveredNode.id) 
                      ? (isDark ? 'bg-rose-500/20 text-rose-400' : 'bg-rose-100 text-rose-700') 
                      : (isDark ? 'bg-cyan-500/20 text-cyan-400' : 'bg-cyan-100 text-cyan-700')
                    }`}>
                     {disruptedHubs.includes(hoveredNode.id) ? 'Offline' : 'Hub'}
                   </span>
                )}
              </div>
              <div className={`text-xs mt-1 flex justify-between gap-4 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                <span>Est. Daily Orders:</span>
                <span className={`font-mono ${isDark ? 'text-cyan-400' : 'text-cyan-600'}`}>{hoveredNode.demand.toLocaleString()}</span>
              </div>
            </div>
          )}

          <svg className="absolute inset-0 w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
            {assignments.map((conn, idx) => {
              const fromNode = BENGALURU_ZONES.find(z => z.id === conn.from);
              const toNode = BENGALURU_ZONES.find(z => z.id === conn.to);
              return (
                <line key={`line-${idx}`} x1={fromNode.x} y1={fromNode.y} x2={toNode.x} y2={toNode.y} stroke={isDark ? "#06b6d4" : "#0891b2"} strokeWidth="0.3" strokeOpacity={isDark ? "0.4" : "0.6"} className="transition-all duration-700 ease-in-out" />
              );
            })}

            {BENGALURU_ZONES.map((zone) => {
              const isHub = activeHubs.includes(zone.id);
              const isDisrupted = disruptedHubs.includes(zone.id);
              const isHovered = hoveredNode?.id === zone.id;
              
              let radius = (zone.demand / 5000) * 1.5 + 0.8;
              let fillColor = isDark ? '#0f172a' : '#ffffff';
              let strokeColor = isDark ? '#334155' : '#cbd5e1';
              let strokeWidth = "0.5";

              if (isHub) {
                radius = 2.5;
                strokeWidth = "1";
                if (isDisrupted) { 
                  fillColor = isDark ? '#4c0519' : '#ffe4e6'; 
                  strokeColor = isDark ? '#f43f5e' : '#e11d48'; 
                } else { 
                  fillColor = isDark ? '#083344' : '#cffafe'; 
                  strokeColor = isDark ? '#06b6d4' : '#0891b2'; 
                }
              } else if (mode === 'config' || mode === 'results') {
                 fillColor = isDark ? '#1e293b' : '#f1f5f9'; 
                 strokeColor = isDark ? '#475569' : '#94a3b8';
              }
              if (isHovered) strokeWidth = "1.5";

              const interactiveProps = {
                onMouseEnter: () => setHoveredNode(zone),
                onMouseLeave: () => setHoveredNode(null),
                onClick: () => onNodeClick(zone),
                className: `transition-all duration-300 ${onNodeClick ? 'cursor-pointer' : ''}`,
                style: { transformOrigin: `${zone.x}px ${zone.y}px` }
              };

              return (
                <g key={zone.id} {...interactiveProps}>
                  {isHub && !isDisrupted && <circle cx={zone.x} cy={zone.y} r={radius * 2.5} fill={isDark ? "#06b6d4" : "#0891b2"} opacity={isDark ? "0.15" : "0.2"} className="animate-pulse pointer-events-none" />}
                  {isHub && isDisrupted && <circle cx={zone.x} cy={zone.y} r={radius * 2.5} fill={isDark ? "#f43f5e" : "#e11d48"} opacity="0.2" className="animate-pulse pointer-events-none" />}
                  <circle cx={zone.x} cy={zone.y} r={radius} fill={fillColor} stroke={strokeColor} strokeWidth={strokeWidth} />
                  <text 
                    x={zone.x} 
                    y={zone.y + (isHub ? 5 : 4)} 
                    fontSize={isHub ? "2.2" : "1.8"} 
                    textAnchor="middle" 
                    fill={isHub && !isDisrupted ? (isDark ? "#cffafe" : "#083344") : isDisrupted ? (isDark ? "#ffe4e6" : "#881337") : (isDark ? "#94a3b8" : "#64748b")} 
                    className={`font-medium tracking-wide transition-colors ${isHovered ? 'font-bold' : ''}`} 
                    style={{ pointerEvents: 'none', textShadow: isDark ? '0 2px 4px rgba(0,0,0,0.8)' : '0 1px 2px rgba(255,255,255,0.8)' }}
                  >
                    {zone.name}
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    };

    const LandingPage = ({ setView }) => (
      <div className="flex flex-col items-center justify-center min-h-[calc(100vh-80px)] text-center px-4 max-w-5xl mx-auto">
        <div className="mb-6 flex justify-center">
          <OptiRouteLogo size={80} className="w-20 h-20 md:w-28 md:h-28 text-slate-900 dark:text-white" />
        </div>
        <div className="mb-8 inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-violet-100 dark:bg-violet-500/10 border border-violet-200 dark:border-violet-500/20 text-violet-700 dark:text-violet-400 text-xs font-semibold tracking-wide uppercase">
          <Icon name="zap" size={14} className="animate-pulse" /> V3.0 Network Engine Live
        </div>
        <h1 className="text-5xl md:text-7xl font-extrabold tracking-tight text-slate-900 dark:text-white mb-6 leading-tight">
          Intelligent Fulfillment <br className="hidden md:block"/> Starts <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-600 via-violet-600 to-fuchsia-600 dark:from-cyan-400 dark:via-violet-400 dark:to-fuchsia-400">Here.</span>
        </h1>
        <p className="text-xl text-slate-600 dark:text-slate-400 mb-10 max-w-2xl font-light leading-relaxed">
          Design the right fulfillment network before you spend money on warehouses. Optimize locations, reduce last-mile costs, and dynamically plan for disruption with Opti_Route.
        </p>
        <div className="flex flex-col sm:flex-row gap-5 mb-24">
          <Button onClick={() => setView('demand')} className="text-lg px-8 py-3.5">
            Start Planning <Icon name="arrow-right" size={20} className="ml-2"/>
          </Button>
        </div>
      </div>
    );

    const DemandMap = ({ setView, isDark }) => {
      const totalOrders = BENGALURU_ZONES.reduce((acc, z) => acc + z.demand, 0);
      return (
        <div className="max-w-6xl mx-auto space-y-6">
          <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div><h2 className="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Demand Intelligence</h2></div>
            <Button onClick={() => setView('config')}>Configure Network <Icon name="settings" size={18} className="ml-2"/></Button>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <Card className="lg:col-span-1 p-0 flex flex-col border-slate-200 dark:border-slate-800">
              <div className="p-6 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/80">
                <p className="text-xs text-slate-500 font-bold tracking-wider uppercase mb-2 flex items-center"><Icon name="package" size={14} className="mr-2"/> Total Est. Daily Orders</p>
                <p className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-500 dark:from-white dark:to-slate-400 tracking-tight">{totalOrders.toLocaleString()}</p>
              </div>
              <div className="p-6 flex-1 overflow-y-auto max-h-[500px]">
                <div className="space-y-5">
                  {BENGALURU_ZONES.sort((a,b) => b.demand - a.demand).map((zone, i) => (
                    <div key={zone.id} className="group">
                      <div className="flex justify-between text-sm mb-2">
                        <span className="font-medium text-slate-700 dark:text-slate-300"><span className="text-slate-400 dark:text-slate-600 text-xs w-4 mr-2">{i+1}.</span>{zone.name}</span>
                        <span className="text-cyan-600 dark:text-cyan-400 font-mono">{zone.demand.toLocaleString()}</span>
                      </div>
                      <div className="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-1.5"><div className="bg-cyan-500 h-1.5 rounded-full" style={{ width: `${(zone.demand / 5500) * 100}%` }}></div></div>
                    </div>
                  ))}
                </div>
              </div>
            </Card>
            <Card className="lg:col-span-2 p-1.5 bg-slate-50 dark:bg-slate-900/40"><InteractiveMap mode="demand" isDark={isDark} /></Card>
          </div>
        </div>
      );
    };

    const Configuration = ({ setView, isDark }) => {
      const [hubs, setHubs] = useState(3);
      const [priority, setPriority] = useState('cost');
      const [isOptimizing, setIsOptimizing] = useState(false);

      const handleOptimize = () => {
        setIsOptimizing(true);
        setTimeout(() => { setIsOptimizing(false); setView('results'); }, 2000);
      };

      return (
        <div className="max-w-6xl mx-auto">
          <div className="mb-6"><h2 className="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Network Parameters</h2></div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <Card className="p-6 md:p-8 space-y-8 relative flex flex-col justify-between">
              {isOptimizing && (
                <div className="absolute inset-0 bg-white/90 dark:bg-slate-950/90 backdrop-blur-sm z-20 flex flex-col items-center justify-center">
                  <div className="w-16 h-16 border-4 border-slate-200 dark:border-slate-800 border-t-cyan-500 rounded-full animate-spin mb-6"></div>
                  <h3 className="text-2xl font-bold text-slate-900 dark:text-white mb-2">Simulating Topologies...</h3>
                </div>
              )}
              <div className="space-y-10">
                <div className="space-y-5">
                  <div className="flex justify-between items-center"><label className="font-semibold text-slate-800 dark:text-slate-200">Target Facilities</label><div className="text-cyan-600 dark:text-cyan-400 font-mono font-bold">{hubs} Max</div></div>
                  <input type="range" min="1" max="6" value={hubs} onChange={(e) => setHubs(e.target.value)} className="w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none accent-cyan-500" />
                </div>
                 <div className="space-y-4">
                  <label className="font-semibold text-slate-800 dark:text-slate-200">Optimization Heuristic</label>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    {[{ id: 'cost', label: 'Cost OPEX' }, { id: 'speed', label: 'Delivery Speed' }, { id: 'sustainability', label: 'Green Routing' }].map(type => (
                      <div key={type.id} onClick={() => setPriority(type.id)} className={`border rounded-xl p-4 cursor-pointer transition-colors ${priority === type.id ? 'border-cyan-500 bg-cyan-50 dark:bg-cyan-500/10' : 'border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50'}`}>
                        <div className={`font-semibold text-sm ${priority === type.id ? 'text-cyan-600 dark:text-cyan-400' : 'text-slate-600 dark:text-slate-300'}`}>{type.label}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
              <Button onClick={handleOptimize} className="w-full py-4 text-lg font-bold" disabled={isOptimizing}>Initialize Engine <Icon name="zap" size={20} className="ml-2"/></Button>
            </Card>
            <Card className="p-1.5 bg-slate-50 dark:bg-slate-900/40 min-h-[400px]"><InteractiveMap mode="config" isDark={isDark} /></Card>
          </div>
        </div>
      );
    };

    const OptimizationResults = ({ setView, isDark }) => {
      const optimalHubs = ['wht', 'jay', 'heb']; 
      return (
        <div className="max-w-7xl mx-auto space-y-6">
          <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-2">
            <div><h2 className="text-3xl font-bold text-slate-900 dark:text-white tracking-tight flex items-center gap-3">Optimal Network Topology <Icon name="check-circle-2" size={28} className="text-emerald-500"/></h2></div>
            <div className="flex flex-wrap gap-3">
              <Button variant="secondary" onClick={() => setView('simulator')}><Icon name="activity" size={16} className="mr-2"/> Scenarios</Button>
              <Button onClick={() => setView('disruption')} className="bg-rose-100 dark:bg-rose-500/10 text-rose-700 dark:text-rose-400 border border-rose-300 dark:border-rose-500/30 hover:bg-rose-200 dark:hover:bg-rose-500/20"><Icon name="shield-alert" size={16} className="mr-2"/> Test Disruption</Button>
            </div>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <Card className="lg:col-span-2 p-1.5 bg-slate-50 dark:bg-slate-900/40"><InteractiveMap mode="results" activeHubs={optimalHubs} isDark={isDark} /></Card>
            <Card className="flex flex-col p-6">
              <h3 className="text-xl font-bold text-slate-900 dark:text-white mb-6">Location Rationale</h3>
              <div className="space-y-4 mb-8">
                <div className="p-4 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 border-l-4 border-l-cyan-500"><p className="font-bold text-slate-800 dark:text-slate-100 flex items-center mb-1"><Icon name="map-pin" size={16} className="text-cyan-500 dark:text-cyan-400 mr-2"/> Whitefield (East Hub)</p></div>

    const JArvIsChatbot = ({ analyticsData }) => {
      const [isOpen, setIsOpen] = useState(false);
      const [messages, setMessages] = useState([
        { sender: 'jArvIs', text: 'System Online. I am jArvIs, your Opti_Route logistics co-pilot. How can I assist with your supply chain planning today?' }
      ]);
      const [input, setInput] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [isSpeakingAnalytics, setIsSpeakingAnalytics] = useState(false);
      const messagesEndRef = useRef(null);
      const recognitionRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      };
      useEffect(scrollToBottom, [messages, isOpen]);

      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          recognitionRef.current = new SpeechRecognition();
          recognitionRef.current.continuous = false;
          recognitionRef.current.interimResults = false;
          
          recognitionRef.current.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            setInput(transcript);
            handleSend(transcript);
          };
          recognitionRef.current.onend = () => setIsListening(false);
          recognitionRef.current.onerror = (e) => {
            console.error("Speech recognition error", e);
            setIsListening(false);
          };
        }
      }, []);

      const toggleListen = () => {
        if (isListening) {
          recognitionRef.current?.stop();
          setIsListening(false);
        } else {
          recognitionRef.current?.start();
          setIsListening(true);
        }
      };

      const handleSend = async (textOverride) => {
        const textToSend = textOverride || input;
        if (!textToSend.trim()) return;

        setMessages(prev => [...prev, { sender: 'user', text: textToSend }]);
        setInput('');
        setIsProcessing(true);

        setTimeout(() => {
          setMessages(prev => [...prev, { sender: 'jArvIs', text: "Opti_Route assistant engine responding to query: " + textToSend }]);
          setIsProcessing(false);
        }, 1000);
      };

      const handleSpeakAnalytics = async () => {
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
        }
        
        setIsSpeakingAnalytics(true);
        setMessages(prev => [...prev, { sender: 'user', text: 'Please summarize the current analytics.' }]);
        
        const summaryText = `Here is your operational update: Total demand stands at ${analyticsData.totalDemand} daily orders. Network efficiency is running optimal at ${analyticsData.networkEfficiency}. Average last mile distance is ${analyticsData.lastMileDistance}, delivering estimated monthly savings of ${analyticsData.totalOpExSavings}.`;

        setMessages(prev => [...prev, { sender: 'jArvIs', text: summaryText }]);
        
        const utterance = new SpeechSynthesisUtterance(summaryText);
        utterance.rate = 0.85;
        utterance.pitch = 0.9;

        utterance.onend = () => setIsSpeakingAnalytics(false);
        utterance.onerror = () => setIsSpeakingAnalytics(false);
        window.speechSynthesis.speak(utterance);
      };

      return (
        <div className="fixed bottom-6 right-6 z-50">
          {isOpen ? (
            <Card className="w-80 sm:w-96 h-[500px] flex flex-col shadow-2xl border-cyan-200 dark:border-cyan-900/50 relative overflow-visible">
              <div className="bg-slate-100 dark:bg-slate-950 p-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <div className="relative">
                    <div className="w-8 h-8 rounded-full bg-cyan-100 dark:bg-cyan-500/20 flex items-center justify-center border border-cyan-300 dark:border-cyan-500/50 text-cyan-600 dark:text-cyan-400">
                      <Icon name="bot" size={18} />
                    </div>
                    {isProcessing && <div className="absolute -inset-1 rounded-full border-2 border-cyan-400 dark:border-cyan-500/50 border-t-transparent animate-spin"></div>}
                  </div>
                  <div>
                    <h3 className="font-black text-slate-900 dark:text-white tracking-wide text-sm">jArvIs</h3>
                    <p className="text-[10px] text-cyan-600 dark:text-cyan-500 uppercase tracking-widest font-mono">Logistics AI</p>
                  </div>
                </div>
                <button onClick={() => setIsOpen(false)} className="text-slate-500 hover:text-slate-800 dark:hover:text-white transition-colors">
                  <Icon name="x" size={20} />
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/80 dark:bg-slate-900/80 custom-scrollbar">
                {messages.map((msg, idx) => (
                  <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[85%] rounded-xl p-3 text-sm ${msg.sender === 'user' ? 'bg-cyan-600 text-white rounded-br-none shadow-md' : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 rounded-bl-none border border-slate-200 dark:border-slate-700 shadow-sm'}`}>
                      {msg.text}
                    </div>
                  </div>
                ))}
                <div ref={messagesEndRef} />
              </div>

              <div className="p-3 bg-slate-100 dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 flex items-center gap-2">
                <button 
                  onClick={handleSpeakAnalytics}
                  disabled={isProcessing || isSpeakingAnalytics}
                  title="Speak Analytics summary in a soothing voice"
                  className={`p-2 rounded-full transition-all ${isSpeakingAnalytics ? 'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 animate-pulse' : 'bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 hover:bg-slate-200 dark:hover:bg-slate-700 shadow-sm border border-slate-200 dark:border-transparent'}`}
                >
                  <Icon name="bar-chart-3" size={18} />
                </button>
                <button 
                  onClick={toggleListen}
                  className={`p-2 rounded-full transition-all ${isListening ? 'bg-rose-100 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400 animate-pulse' : 'bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-400 hover:bg-slate-200 dark:hover:bg-slate-700 shadow-sm border border-slate-200 dark:border-transparent'}`}
                >
                  <Icon name="mic" size={18} />
                </button>
                <input 
                  type="text"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                  placeholder="Ask jArvIs..."
                  className="flex-1 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-full px-4 py-2 text-sm text-slate-800 dark:text-white focus:outline-none focus:border-cyan-500 transition-colors shadow-inner"
                />
                <button 
                  onClick={() => handleSend()}
                  disabled={!input.trim() || isProcessing}
                  className="p-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-full transition-colors disabled:opacity-50 shadow-md"
                >
                  <Icon name="send" size={16} className="ml-0.5" />
                </button>
              </div>
            </Card>
          ) : (
            <button 
              onClick={() => setIsOpen(true)}
              className="w-14 h-14 bg-cyan-600 hover:bg-cyan-500 rounded-full flex items-center justify-center text-white dark:text-slate-950 shadow-[0_0_20px_rgba(6,182,212,0.5)] transition-all hover:scale-105 group relative"
            >
              <div className="absolute inset-0 rounded-full border-2 border-cyan-400 animate-ping opacity-20 group-hover:opacity-40"></div>
              <Icon name="bot" size={28} />
            </button>
          )}
        </div>
      );
    };

                  aria-label="Toggle Theme"
                >
                  <Icon name={isDark ? "sun" : "moon"} size={20} />
                </button>
              </div>
            </div>
          </nav>

          <main className="pt-10 px-4 relative z-10">
            {renderView()}
          </main>
          
          <JArvIsChatbot analyticsData={analyticsData} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
